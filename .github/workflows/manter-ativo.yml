name: Manter banco ativo
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Tocar no banco
        run: |
          curl -sf -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/listar_produtos" -H "apikey: ${{ secrets.SUPABASE_KEY }}" -H "Content-Type: application/json" -d '{}' > /dev/null
